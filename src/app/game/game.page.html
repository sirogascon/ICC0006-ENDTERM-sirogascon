<ion-header>
  <ion-toolbar>
    <ion-title>Juego</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="game-actions">
    <ion-button size="small" (click)="pauseGame()">Pausar</ion-button>
    <ion-button size="small" color="success" (click)="resumeGame()">Reanudar</ion-button>
    <ion-button size="small" color="warning" (click)="restartGame()">Reiniciar</ion-button>
  </div>

  <div class="game-info">
    <p>Puntuación: {{ score }}</p>
    <p>Golpes: {{ hits }}/3</p>
  </div>

  <div id="game-container"></div>
</ion-content>
